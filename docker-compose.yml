# MFD Talent Acquisition Tool — full local stack.
#
#   cp .env.example .env      # then set an AI key (ANTHROPIC_API_KEY or GEMINI_API_KEY) and ENCRYPTION_KEY
#   docker compose up --build
#
# Values are read from .env when present; every variable has a development
# fallback inline (matching .env.example) so the stack boots without one —
# except the AI API key (ANTHROPIC_API_KEY or GEMINI_API_KEY) and ENCRYPTION_KEY, which you must provide.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mfd
      POSTGRES_PASSWORD: mfd_dev_password
      POSTGRES_DB: mfd_tat
    ports:
      # Bound to localhost — with teammates reaching the app over the LAN,
      # the database (dev-default credentials) must not be network-exposed.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mfd -d mfd_tat"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-mfd-minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-mfd-minio-secret}
    ports:
      # Localhost-only for the same reason as postgres — the browser never
      # talks to MinIO directly (all file traffic streams through the API).
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # web console
    volumes:
      - minio-data:/data
    healthcheck:
      # Depending on the image release, either curl or mc is available.
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || mc ready local"]
      interval: 5s
      timeout: 5s
      retries: 12

  # One-shot job: creates the documents bucket, then exits.
  minio-init:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-mfd-minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-mfd-minio-secret}
      S3_BUCKET: ${S3_BUCKET:-mfd-documents}
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 \"$$S3_ACCESS_KEY\" \"$$S3_SECRET_KEY\" &&
        mc mb --ignore-existing local/\"$$S3_BUCKET\" &&
        echo 'minio-init: bucket ready'
      "

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      API_CORS_ORIGIN: ${API_CORS_ORIGIN:-http://localhost:3000,http://127.0.0.1:3000}
      DATABASE_URL: postgresql://mfd:mfd_dev_password@postgres:5432/mfd_tat?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-string}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-12h}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@mfd.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}
      ADMIN_NAME: ${ADMIN_NAME:-MFD Admin}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env — generate with `openssl rand -base64 32`}
      LLM_PROVIDER: ${LLM_PROVIDER:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-medium}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-pro}
      EMAIL_MODE: ${EMAIL_MODE:-}
      SES_SMTP_HOST: ${SES_SMTP_HOST:-}
      SES_SMTP_PORT: ${SES_SMTP_PORT:-587}
      SES_SMTP_USER: ${SES_SMTP_USER:-}
      SES_SMTP_PASS: ${SES_SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-hiring@metafordata.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-MFD Talent}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-}
      PRESCREEN_FORM_URL: ${PRESCREEN_FORM_URL:-https://forms.gle/ArPHA9cm3CDNdbgg7}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:3000}
      WHATSAPP_MODE: ${WHATSAPP_MODE:-simulated}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_TEMPLATE_INVITE: ${WHATSAPP_TEMPLATE_INVITE:-}
      WHATSAPP_TEMPLATE_LANG: ${WHATSAPP_TEMPLATE_LANG:-en}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v21.0}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-mfd-minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-mfd-minio-secret}
      S3_BUCKET: ${S3_BUCKET:-mfd-documents}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      CHROMIUM_PATH: /usr/bin/chromium
      OCR_ENABLED: ${OCR_ENABLED:-true}
      SCORE_WEIGHT_SKILLS: ${SCORE_WEIGHT_SKILLS:-35}
      SCORE_WEIGHT_EXPERIENCE: ${SCORE_WEIGHT_EXPERIENCE:-25}
      SCORE_WEIGHT_KEYWORDS: ${SCORE_WEIGHT_KEYWORDS:-20}
      SCORE_WEIGHT_EDUCATION: ${SCORE_WEIGHT_EDUCATION:-10}
      SCORE_WEIGHT_ATS: ${SCORE_WEIGHT_ATS:-10}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Empty by default: the client derives the API address from whatever
        # host the browser used (localhost, LAN IP, …), so no rebuild is needed
        # when the machine's IP changes. Set NEXT_PUBLIC_API_URL only to pin a
        # specific API origin — it is baked in at build time.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
  minio-data:
